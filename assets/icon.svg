<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE14D"/><stop offset="1" stop-color="#FCD116"/></linearGradient>
    <linearGradient id="dice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e2cc"/></linearGradient>
    <radialGradient id="shine" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- Fondo: bandera de Colombia -->
  <rect width="1024" height="1024" fill="url(#gold)"/>
  <rect y="512" width="1024" height="256" fill="#0b4ea2"/>
  <rect y="768" width="1024" height="256" fill="#CE1126"/>
  <!-- Sombra y dado inclinado (el 5: el número que saca la ficha de la cárcel) -->
  <g transform="rotate(-12 512 470)">
    <rect x="262" y="236" width="500" height="500" rx="96" fill="#000" opacity=".28" transform="translate(0 22)"/>
    <rect x="262" y="236" width="500" height="500" rx="96" fill="url(#dice)" stroke="#0b2a6b" stroke-width="18"/>
    <rect x="262" y="236" width="500" height="500" rx="96" fill="url(#shine)"/>
    <g fill="#1b1b2f">
      <circle cx="372" cy="346" r="42"/><circle cx="652" cy="346" r="42"/>
      <circle cx="372" cy="626" r="42"/><circle cx="652" cy="626" r="42"/>
    </g>
    <circle cx="512" cy="486" r="54" fill="#CE1126" stroke="#1b1b2f" stroke-width="10"/>
  </g>
  <!-- Las 4 fichas (una por región) -->
  <g stroke="#1b1b2f" stroke-width="10">
    <circle cx="332" cy="800" r="40" fill="#FCD116"/>
    <circle cx="447" cy="800" r="40" fill="#1e6fe0"/>
    <circle cx="562" cy="800" r="40" fill="#e03146"/>
    <circle cx="677" cy="800" r="40" fill="#22b162"/>
  </g>
  <g fill="#fff" opacity=".6">
    <ellipse cx="320" cy="786" rx="12" ry="8"/><ellipse cx="435" cy="786" rx="12" ry="8"/>
    <ellipse cx="550" cy="786" rx="12" ry="8"/><ellipse cx="665" cy="786" rx="12" ry="8"/>
  </g>
</svg>
